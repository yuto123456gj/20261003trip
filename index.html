<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ふたりの記録">
<meta name="theme-color" content="#1E2A38">
<title>ふたりの記録</title>
<style>
:root{
  --navy:#1E2A38; --navy-2:#2B3B4E; --navy-soft:#5A6B7D;
  --gold:#C2A15C; --gold-l:#E2C78C; --gold-d:#9E8144;
  --pink:#E3C4B6; --pink-d:#C99C89; --cream:#FBF5F0;
  --ink:#33404E; --ink-mute:#8A96A3; --line:rgba(30,42,56,.10);
  --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Times New Roman",serif;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  --round:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Hiragino Sans",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);color:var(--ink);background:var(--cream);
  background-image:
    radial-gradient(120% 60% at 50% 0%, rgba(227,196,182,.35) 0%, rgba(251,245,240,0) 60%),
    radial-gradient(90% 50% at 100% 100%, rgba(194,161,92,.14) 0%, rgba(251,245,240,0) 70%);
  background-attachment:fixed;line-height:1.75;-webkit-font-smoothing:antialiased;
}
.app{max-width:480px;margin:0 auto;padding:0 18px calc(48px + env(safe-area-inset-bottom));}

.hero{
  position:relative;margin:0 -18px 30px;
  padding:calc(54px + env(safe-area-inset-top)) 26px 48px;
  background:linear-gradient(165deg,#243244 0%,#1E2A38 55%,#18222E 100%);
  color:#fff;overflow:hidden;border-radius:0 0 30px 30px;
  box-shadow:0 18px 40px -22px rgba(30,42,56,.7);text-align:center;
}
.hero::before{
  content:"";position:absolute;width:260px;height:260px;top:-120px;right:-90px;border-radius:50%;
  background:radial-gradient(circle,rgba(226,199,140,.3),rgba(226,199,140,0) 68%);
}
.hero .k{
  position:relative;font-size:10px;letter-spacing:.42em;text-indent:.42em;
  color:var(--gold-l);font-weight:700;margin:0 0 16px;
}
.hero h1{
  position:relative;font-family:var(--serif);font-size:clamp(26px,8vw,34px);
  margin:0;letter-spacing:.14em;text-indent:.14em;font-weight:600;
  background:linear-gradient(100deg,#F4E3BE 0%,#C2A15C 42%,#F7EBD2 62%,#C2A15C 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.hero .rule{width:64px;height:1px;margin:18px auto 14px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.hero p{position:relative;margin:0;font-size:11.5px;letter-spacing:.2em;color:rgba(255,255,255,.6);}

.count{margin:0 2px 18px;font-size:10px;letter-spacing:.3em;color:var(--gold-d);font-weight:700;}

.trip{
  display:block;text-decoration:none;color:inherit;
  background:#fff;border:1px solid var(--line);border-radius:20px;
  padding:0;margin-bottom:16px;overflow:hidden;
  box-shadow:0 10px 26px -18px rgba(30,42,56,.5);
  transition:transform .25s cubic-bezier(.2,.8,.3,1),box-shadow .3s ease;
}
.trip:active{transform:scale(.99);box-shadow:0 6px 16px -14px rgba(30,42,56,.5);}
.trip .cover{
  height:132px;position:relative;
  background:linear-gradient(140deg,#2B3B4E,#1E2A38 60%,#16202B);
  display:grid;place-items:center;overflow:hidden;
}
.trip .cover::after{
  content:"";position:absolute;width:220px;height:220px;top:-90px;right:-60px;border-radius:50%;
  background:radial-gradient(circle,rgba(226,199,140,.28),rgba(226,199,140,0) 70%);
}
.trip .cover img{width:100%;height:100%;object-fit:cover;display:block;}
.trip .cover .ph{
  position:relative;font-family:var(--serif);font-size:13px;letter-spacing:.3em;
  color:rgba(255,255,255,.5);
}
.trip .body{padding:16px 18px 18px;}
.trip .date{font-size:10px;letter-spacing:.24em;color:var(--gold-d);font-weight:700;}
.trip h2{font-family:var(--serif);font-size:18px;margin:5px 0 4px;letter-spacing:.06em;color:var(--navy);font-weight:600;}
.trip .place{margin:0;font-size:12.5px;color:var(--ink-mute);}
.trip .go{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
  font-size:11px;letter-spacing:.14em;color:var(--gold-d);font-weight:700;
}

.next{
  border:1px dashed rgba(194,161,92,.45);border-radius:20px;
  padding:24px 18px;text-align:center;background:rgba(255,255,255,.5);
}
.next b{display:block;font-family:var(--round);font-size:14px;color:var(--navy-soft);letter-spacing:.06em;}
.next small{display:block;font-size:11.5px;color:var(--ink-mute);margin-top:5px;}

.foot{margin:34px 0 0;text-align:center;font-size:10px;letter-spacing:.28em;color:rgba(30,42,56,.28);}
</style>
</head>
<body>
<div class="app">

  <header class="hero">
    <p class="k">✦ OUR RECORD ✦</p>
    <h1>ふたりの記録</h1>
    <div class="rule"></div>
    <p>TRIPS &amp; MEMORIES</p>
  </header>

  <p class="count">1 TRIP</p>

  <a class="trip" href="trips/2026-1003/">
    <div class="cover">
      <img src="trips/2026-1003/photos/20261004-172902-cmh3.jpg" alt="片瀬江ノ島駅の夕景">
    </div>
    <div class="body">
      <div class="date">2026.10.03 – 04</div>
      <h2>Happy Birthday Trip</h2>
      <p class="place">みなとみらい ＆ 江ノ島 / 1泊2日</p>
      <div class="go"><span>しおりとアルバムを見る</span><span>→</span></div>
    </div>
  </a>

  <div class="next">
    <b>つぎの旅はここに増えていきます</b>
    <small>また行こうね</small>
  </div>

  <p class="foot">MADE WITH ♡</p>
</div>
</body>
</html>
